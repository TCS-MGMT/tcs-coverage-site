<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TCS Coverage</title>
<meta name="description" content="Texas Cleaning Services office coverage: who is on each city's phones right now, the weekly schedule, and the daily report." />
<meta name="theme-color" content="#eb7c54" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="TCS Coverage" />
<link rel="icon" type="image/png" href="logo.png?v=1" />
<link rel="apple-touch-icon" href="logo.png?v=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>

<!-- ============================== SIGN IN ============================== -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img class="login-logo" src="logo.png?v=1" alt="Texas Cleaning Services" />
    <h1>Office Coverage</h1>
    <p class="muted">Sign in to see who's on the phones and your schedule.</p>
    <label>Email <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@texascleaningservs.com" /></label>
    <label>Password <input type="password" id="loginPass" required autocomplete="current-password" /></label>
    <button type="submit" class="btn primary block" id="loginBtn">Sign in</button>
    <div id="loginErr" class="login-err" hidden></div>
    <p class="muted small">No login yet? Ask your manager to add you.</p>
  </form>
</div>

<!-- ================================ APP ================================ -->
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <img src="logo.png?v=1" alt="" />
      <div class="brand-text"><b>Office Coverage</b><span id="topDate"></span></div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div class="me">
      <span id="live" class="live"></span>
      <span id="whoName" class="who"></span>
      <button id="signOut" class="link-btn" type="button" hidden>Sign out</button>
    </div>
  </header>
  <div id="flash" class="flash" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <main id="view"></main>
  <div id="printSheet" class="print-sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2"></script>
<script type="module" src="app.js?v=21"></script>
</body>
</html>
